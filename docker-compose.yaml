services:
  postgres:
    image: postgres:18
    container_name: simulation-postgres
    environment:
      POSTGRES_DB: simulation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simulation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: